<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Application - Nursing Program</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">Nursing Program</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/applications">Applications</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Edit Application</h1>
        <form id="editForm" method="POST" onsubmit="return editApplicationForm(event)">
            <input type="hidden" id="application-id" name="id">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
                <div id="nameError" class="error"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div id="emailError" class="error"></div>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" required>
                <div id="phoneError" class="error"></div>
            </div>
            <div class="mb-3">
                <label for="gpa" class="form-label">GPA</label>
                <input type="number" class="form-control" id="gpa" name="gpa" step="0.1" min="0" max="4" required>
                <div id="gpaError" class="error"></div>
            </div>
            <div class="mb-3">
                <label for="work_location" class="form-label">Which locations are you willing to work in?</label>
                <input type="text" class="form-control" id="work_location" name="work_location"/>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="passed_nclex" name="passed_nclex"/>
                <label for="passed_nclex" class="form-check-label">Have you passed the NCLEX?</label>
            </div>
            <div class="mb-3">
                <label for="nclex_state" class="form-label">Which state did you pass the NCLEX?</label>
                <input type="text" class="form-control" id="nclex_state" name="nclex_state"/>
            </div>
            <button type="submit" class="btn btn-primary">Update Application</button>
            <a href="/admin" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js"></script>

    <script>
        // Load applications on page load
        window.onload = loadEditableApplication;
    </script>
</body>
</html>
